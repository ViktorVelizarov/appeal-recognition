<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleStealer — Sign in</title>
<meta name="description" content="StyleStealer uses AI vision to detect every garment in a photo, then finds the same or similar pieces and shows where to buy them online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="auth-top">
  <a class="logo" href="index.html" aria-label="StyleStealer home"><span>Style<br>Stealer</span></a>
  <a class="auth-top-link" href="signup.html">New here? Create an account</a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <div>
      <h1 class="mega">Sign in<b>.</b></h1>
      <p class="auth-sub">Welcome back. Sign in to see your scans and matches.</p>
    </div>
    <div class="auth-fields">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Your password" autocomplete="current-password">
      </div>
    </div>
    <a class="btn auth-cta" href="demo.html">Sign in <span aria-hidden="true">&#8599;</span></a>
    <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    <p class="auth-fine">This is a design mockup &mdash; the form does not sign in to a real account.</p>
  </div>
</main>

</body>
</html>
